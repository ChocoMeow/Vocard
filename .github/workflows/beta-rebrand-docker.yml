name: Beta Rebrand Docker

on:
  push:
    branches:
      - beta  # Trigger when beta branch is updated

permissions:
  contents: write
  packages: write

jobs:
  rebrand-and-docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout beta branch
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      # Step 3: Install dependencies (if needed)
      - name: Install Python dependencies
        run: pip install --upgrade pip

      # Step 4: Run branding script
      - name: Run Rebrand Script
        run: python scripts/branding.py

      # Step 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 7: Build Docker metadata for rebrand tag
      - name: Set Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nischay876/mecute
          tags: type=raw,value=rebrand

      # Step 8: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
